<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAB: Voice Autopilot benchmark</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1c1d1f; --muted: #686b70; --faint: #9a9da2; --line: #e2e1dc; --soft: #f0efea;
  --accent: #b5561c; --gt: #5b7fae;
  --ok: #3f8f52; --okb: #86c296; --near: #d39b2a; --bad: #c4473f; --none: #cfcdc6; --wg: #b9c6d6; --gap: #d9e3dc; --unscored: #eceae4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111315; --card: #1a1d20; --ink: #e8e9ea; --muted: #a2a6ab; --faint: #73777c; --line: #2f3337; --soft: #22262a;
    --accent: #e08a50; --gt: #7f9fcb; --ok: #62b375; --okb: #3d7a4c; --near: #e3b14a; --bad: #e0675f; --none: #4a4e53; --wg: #3d4a5a; --gap: #2c3a31; --unscored: #25292d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111315; --card: #1a1d20; --ink: #e8e9ea; --muted: #a2a6ab; --faint: #73777c; --line: #2f3337; --soft: #22262a;
  --accent: #e08a50; --gt: #7f9fcb; --ok: #62b375; --okb: #3d7a4c; --near: #e3b14a; --bad: #e0675f; --none: #4a4e53; --wg: #3d4a5a; --gap: #2c3a31; --unscored: #25292d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 56px; }

.lead { color: var(--muted); margin: 4px 0 18px; max-width: 72ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }

.summary p { margin: 0 0 12px; max-width: 80ch; }
.prov { font-size: 14px; background: var(--soft); border-left: 3px solid var(--near); padding: 6px 10px; border-radius: 4px; }
.kpi .v.provv { color: var(--muted); }
.vt { font-size: 14px; margin: 0 0 12px; width: 100%; border-collapse: collapse; }
.vt td, .vt th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.vt th { color: var(--muted); font-weight: 500; font-size: 12px; } .vt td.n, .vt th.n { text-align: right; font-variant-numeric: tabular-nums; }
.vt tr.sel td { font-weight: 600; }
.tabs small { font-size: 11px; opacity: .7; }
.bigch { font-size: 14px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 210px 120px; gap: 4px 14px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; text-decoration: none; color: inherit; }
.item:first-child { border-top: 0; }

.dmeta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }

.verdict li { margin: 2px 0; }
.aplayer { margin: 0 0 12px; } .aplayer audio { width: 100%; max-width: 640px; }
.player { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 9; margin: 0 0 12px; border-radius: 10px; overflow: hidden; background: #000; }
.player iframe, .player > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.playnote { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.ev .when button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-variant-numeric: tabular-nums; }

.tl .l { font-size: 12px; color: var(--muted); text-align: right; }
.big { position: relative; height: 22px; border-radius: 3px; background: var(--unscored); overflow: hidden; cursor: crosshair; }

.big.gt i { border-right: 1px solid var(--card); }

.axis { position: relative; height: 16px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; transform: translateX(-50%); }

.now { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 3px 10px; font-size: 14px; min-height: 64px; }
.now .l { font-size: 12px; color: var(--muted); text-align: right; padding-top: 2px; }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.now .hint { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-right: 6px; color: #fff; vertical-align: 1px; }
.events { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.events h3 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 96px 110px minmax(0, 1fr); gap: 2px 10px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.ev:first-of-type { border-top: 0; }
.ev .when { font-variant-numeric: tabular-nums; }
.ev .when a { text-decoration: none; }
.ev .who { color: var(--muted); font-size: 13px; }
details.about { margin-top: 22px; font-size: 14px; color: var(--muted); }
details.about summary { cursor: pointer; color: var(--ink); }
details.about p { max-width: 75ch; }
@media (max-width: 640px) {
  .item { grid-template-columns: minmax(0, 1fr) 84px; }
  .item .mini { grid-column: 1 / -1; grid-row: 2; }
  .ev { grid-template-columns: 64px minmax(0, 1fr); }
  .ev .who, .ev > span:nth-child(3) { grid-column: 2; }
  .tl, .now { grid-template-columns: 52px minmax(0, 1fr); }
}
</style>

<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const f1 = (v) => (v == null ? '–' : v.toFixed(1));
const short = (s) => String(s).replace(/^Gurbani Autopilot\s*/, '');
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const COL = { P: 'var(--ok)', S: 'var(--ok)', B: 'var(--okb)', A: 'var(--bad)', W: 'var(--bad)', N: 'var(--none)', V: 'var(--wg)', G: 'var(--gap)' };
const RIGHT = (k) => k === 'P' || k === 'S' || k === 'B';
const TABNAME = { main: 'Kirtan', akhand: 'Akhand Kirtan', kbv1: "Karanbir Singh's benchmark", hard: 'Hall recordings (hard)', real: 'Real sessions', paath: 'Paath', sungbani: 'Sung Bani', akhandpaath: 'Sehaj / Akhand Paath' };
const TABORDER = ['main', 'paath', 'sungbani', 'akhandpaath', 'akhand', 'kbv1', 'hard', 'real'];
const tabsSorted = () => [...INDEX.tiers].sort((p, q) => (TABORDER.indexOf(p.key) + 99) % 99 - (TABORDER.indexOf(q.key) + 99) % 99);
const VERB = { main: 'Kirtan from Gurdwara Sahib broadcasts on YouTube', akhand: 'Akhand Kirtan from smagam recordings on YouTube', kbv1: "Karanbir Singh's 4 kirtan recordings, each also joined 1/3 and 2/3 of the way in", hard: 'Kirtan recorded in a resonant hall on a laptop microphone (the hardest audio)', real: "Real sangat sessions, replayed offline; the answer key is the sevadaar's screen, which itself lags the singing", paath: 'Paath of the Banis (Japji Sahib, Rehras Sahib, Sohila Sahib and others), read aloud', sungbani: 'Banis sung like kirtan (for example Aarti, Anand Sahib, Asa di Vaar)', akhandpaath: 'Sri Guru Granth Sahib Ji read straight through, Ang after Ang (Sehaj Paath recordings from YouTube)' };
// first Shabad of a "Shabad: A  /  Shabad: B" label, without the prefix
const label = (t) => String(t || '').split(/\s+\/\s+/).map((x) => x.replace(/^Shabad:\s*/, '').replace(/^Bani:\s*(.*)$/, '$1 (Bani)')).join('  or  ');
const label1 = (t) => label(t).split('  or  ')[0];
let INDEX = null; const DATA = {};
async function load(f) { if (!DATA[f]) DATA[f] = await (await fetch('timeline/' + f)).json(); return DATA[f]; }

// ---------- per-recording facts (all derived from the per-second runs) ----------
const nn = (c, k) => c.n[k] || 0;
const scored = (c) => nn(c, 'P') + nn(c, 'A') + nn(c, 'S') + nn(c, 'B') + nn(c, 'W') + nn(c, 'N') + nn(c, 'V'); // G (no pangti being said) is never scored
let SETPANGTI = false; // the whole set is judged on one basis: pangti when most recordings have a pangti key
const pangtiKeyed = (c) => SETPANGTI && !!c.basis;
const PAATHSETS = ['paath', 'akhandpaath']; const SUNGBANI = 'sungbani';
const isRead = () => PAATHSETS.includes(S.tier);
const W = () => isRead() ? { act: 'read', place: 'the right place in the Bani', sung: 'Pangti read', while: 'while reading' } : S.tier === SUNGBANI ? { act: 'sung', place: 'the right place in the Bani', sung: 'Pangti sung', while: 'while singing' } : { act: 'sung', place: 'the right Shabad', sung: SETPANGTI ? 'Pangti sung' : 'Shabad sung', while: 'while singing' };
const VDESC = { 'f475fd9a': 'in the experimental app today', '5348d9a0': 'previous experimental', '9b1fa814': 'candidate, not in the app yet', '6a866c94': 'newest candidate, not in the app yet' };
const KEYNOTE = { human: 'answer key checked by a person', aligned: 'answer key machine-aligned, not yet checked by a person', 'broadcast-caption': "answer key from the broadcast's own on-screen pangtis", 'indep-mms2-agree': 'independent machine timing: two public speech models (not Voice Autopilot\'s) agree on the pangti' };
const SETNOTE = { main: 'Pangti timings are independent of Voice Autopilot: two public speech models (Meta MMS) must agree, measured 99% right against person-made keys. About half of each recording is timed; recordings under 60% timed are left out.', sungbani: 'Unproven: the independent timings for Sung Bani are checked against only one person-made recording so far. Treat as a rough guide.', akhand: 'Precision not yet measured: there are no person-made pangti keys for Akhand Kirtan to check the independent timings against.', paath: 'Independent timings (two public models must agree), 100% right on Sehaj Paath against broadcast captions; the read Banis have no person-made key yet to check against.' };
const keyNote = (b) => KEYNOTE[b] || 'answer key at Shabad level';
function acc(c) { if (!c) return null; const t = scored(c); if (!t) return null;
  if (pangtiKeyed(c)) { const d = nn(c, 'P') + nn(c, 'B') + nn(c, 'A') + nn(c, 'W') + nn(c, 'N') + nn(c, 'V'); return d ? 100 * (nn(c, 'P') + nn(c, 'B')) / d : null; }
  return 100 * (nn(c, 'P') + nn(c, 'A') + nn(c, 'S') + nn(c, 'B')) / t; }
function facts(c, d) {
  if (!c) return null;
  const firstKey = c.runs.find((r) => r[3] >= 0);
  const start = firstKey ? firstKey[0] : 0;
  const firstRight = c.runs.find((r) => RIGHT(r[2]) || r[2] === 'A');
  const viaBani = !!firstRight && firstRight[2] === 'B';
  const find = firstRight ? Math.max(0, firstRight[0] - start) : null;
  // merge stretches of one kind (gaps under 2 s join), keep the shown text of the longest piece
  const stretches = (kind, min) => { const out = [];
    for (const r of c.runs) { if (r[2] !== kind) continue; const last = out[out.length - 1];
      if (last && r[0] - last.e <= 2) { last.e = r[1]; if (r[1] - r[0] > last.best) { last.best = r[1] - r[0]; last.shown = r[4]; } }
      else out.push({ s: r[0], e: r[1], best: r[1] - r[0], shown: r[4], truth: r[3] }); }
    return out.filter((x) => x.e - x.s >= min); };
  const wrong = stretches('W', 2), blank = stretches('N', 8), other = pangtiKeyed(c) ? stretches('A', 6) : [];
  const catAt = (t) => { const r = c.runs.find((x) => t >= x[0] && t < x[1]); return r ? r[2] : null; };
  for (const w of wrong) { w.parmaan = w.e - w.s <= 20 && RIGHT(catAt(w.s - 1)) && RIGHT(catAt(w.e));
    const t = w.shown >= 0 ? label(d.texts[w.shown]) : ''; w.ahead = w.e - w.s <= 5 && t.split(/\s+/).length <= 5 && /ਮਹਲਾ|ਸਲੋਕ|ਪਉੜੀ|ਰਾਗੁ|ਛੰਤ/.test(t); }
  const lost = nn(c, 'W') + nn(c, 'N');
  return { start, find, viaBani, wrong, blank, other, wrongS: nn(c, 'W'), lost, scoredS: scored(c), acc: acc(c) };
}
const pct = (v) => (v == null ? '–' : Math.round(v) + '%');
function cmp(a, b, higherBetter = true, unit = '') {
  if (a == null || b == null) return '';
  const d = a - b; if (Math.abs(d) < 0.5) return '<span class="same">same</span>';
  const good = higherBetter ? d > 0 : d < 0;
  return `<span class="${good ? 'better' : 'worse'}">${good ? 'better' : 'worse'} by ${Math.abs(d).toFixed(unit === '%' ? 1 : 0)}${unit}</span>`;
}
const median = (xs) => { const v = xs.filter((x) => x != null).sort((p, q) => p - q); return v.length ? v[Math.floor(v.length / 2)] : null; };
const pos = (s, e, d) => `left:${(100 * s / d).toFixed(3)}%;width:${(100 * (e - s) / d).toFixed(3)}%`;
const stripHtml = (c) => c ? c.runs.map((r) => `<i style="${pos(r[0], r[1], c.dur)};background:${COL[r[2]]}"></i>`).join('') : '';

// ---------- state ----------
const S = { tier: null, a: null, b: null, filter: 'worst' };
function readHash() { const h = decodeURIComponent(location.hash.slice(1)); return h || null; }

let AUDIO = {}; // recording id -> our own audio file (private page only); played instead of YouTube
async function main() {
  INDEX = await (await fetch('timeline/index.json')).json();
  try { const r = await fetch('audio/index.json'); if (r.ok) AUDIO = await r.json(); } catch (_) { AUDIO = {}; }
  let keep = null; try { keep = JSON.parse(store.get('gab-v4') || 'null'); } catch (_) {}
  const q = new URLSearchParams(location.search);
  S.tier = (q.get('set') && INDEX.tiers.some((t) => t.key === q.get('set'))) ? q.get('set') : (keep && INDEX.tiers.some((t) => t.key === keep.tier) ? keep.tier : INDEX.tiers[0].key);
  pickBuilds(keep);
  addEventListener('hashchange', render);
  render();
}
function tierObj() { return INDEX.tiers.find((t) => t.key === S.tier); }
function pickBuilds(keep) {
  const f = tierObj().builds.map((x) => x.file);
  S.a = keep && f.includes(keep.a) ? keep.a : f[f.length - 1];
  S.b = keep && keep.b && f.includes(keep.b) && keep.b !== S.a ? keep.b : ''; // one version by default; comparing is optional
}
const nameOf = (file) => short(tierObj().builds.find((x) => x.file === file)?.label || '');
function save() { store.set('gab-v4', JSON.stringify({ tier: S.tier, a: S.a, b: S.b })); }

async function render() {
  save();
  const dA = await load(S.a), dB = S.b ? await load(S.b) : null;
  SETPANGTI = dA.clips.filter((c) => c.basis).length > dA.clips.length / 2;
  const id = readHash();
  const clip = id && dA.clips.find((c) => c.id === id);
  if (clip) return renderDetail(clip, dA, dB);
  renderList(dA, dB);
}

// ---------- overview ----------
async function renderList(dA, dB) {
  HAS = new Set([...dA.clips, ...(dB ? dB.clips : [])].flatMap((c) => c.runs.map((r) => r[2])));
  const tier = tierObj(), nA = nameOf(S.a), nB = S.b ? nameOf(S.b) : '';
  const byB = dB ? new Map(dB.clips.map((c) => [c.id, c])) : null;
  const rows = dA.clips.map((c) => { const o = byB ? byB.get(c.id) : null; const first = label1(dA.texts[(c.runs.find((r) => r[3] >= 0) || [])[3]] || c.id);
    return { c, o, fa: facts(c, dA), fb: facts(o, dB), title: c.bani ? c.bani : first, sub: c.bani ? first : '' }; });
  const baniCount = {}; rows.forEach((r) => { if (r.c.bani) { baniCount[r.c.bani] = (baniCount[r.c.bani] || 0) + 1; r.nth = baniCount[r.c.bani]; } });
  const both = rows.filter((r) => !byB || r.o);
  const tot = (key) => { let w = 0, v = 0, wr = 0, sec = 0; for (const r of both) { const c = key === 'a' ? r.c : r.o; const a = acc(c); if (a == null) continue; const t = scored(c); w += t; v += a * t; wr += nn(c, 'W'); sec += t; } return { acc: w ? v / w : null, wrongH: sec ? wr / (sec / 3600) : null, hours: sec / 3600 }; };
  const TA = tot('a'), TB = dB ? tot('b') : null;
  const keyed = SETPANGTI;
  const majBasis = (() => { const m = {}; for (const r of both) m[r.c.basis] = (m[r.c.basis] || 0) + 1; return Object.entries(m).sort((p, q) => q[1] - p[1])[0]?.[0]; })();
  const prov = keyed && majBasis === 'aligned';
  const what = keyed ? 'the right pangti' : 'the right Shabad';
  const keyedWord = keyed ? 'pangti' : 'Shabad';
  const neverA = both.filter((r) => r.fa.find == null).length, neverB = dB ? both.filter((r) => r.fb && r.fb.find == null).length : null;
  const big = dB ? both.filter((r) => r.o).map((r) => ({ r, d: (r.fa.acc ?? 0) - (r.fb.acc ?? 0) })).filter((x) => Math.abs(x.d) >= 10).sort((p, q) => Math.abs(q.d) - Math.abs(p.d)) : [];
  const identical = dB && both.every((r) => r.o && JSON.stringify(r.c.runs) === JSON.stringify(r.o.runs));
  let verdictLine = '';
  if (dB) {

    else { const better = dAcc > 0 || (Math.abs(dAcc) < 1 && dW < 0); const win = better ? nA : nB, lose = better ? nB : nA;

  const bigLine = big.length ? `<p class="bigch">Biggest changes: ${big.slice(0, 4).map((x) => `<a href="#${encodeURIComponent(x.r.c.id)}"><span class="g">${esc(x.r.title)}</span></a> <span class="${x.d > 0 ? 'better' : 'worse'}">${pct(x.r.fa.acc)} vs ${pct(x.r.fb.acc)}</span>`).join(' · ')}${big.length > 4 ? ` · and ${big.length - 4} more under “Different between versions”` : ''}</p>` : '';

function renderDetail(c, dA, dB) {

    return `<div class="verdict"><h3>${esc(name)} <b>${pct(f.acc)}</b></h3><ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul></div>`;
  };

    else if (!f.wrong.length) ev.push({ s: f.start, who, kind: 'none', text: `Never found ${W().place}; ${f.blank.length ? 'the screen stayed empty' : 'nothing right was shown'}` });
    for (const x of f.wrong) ev.push({ s: x.s, who, kind: x.ahead || x.parmaan ? 'par' : 'bad', text: `${x.ahead ? 'Moved ahead to the next Shabad\'s heading for ' + (x.e - x.s) + ' s:' : f.find == null ? 'Never showed the right Shabad; showed' : x.parmaan ? 'Another Shabad (possibly a parmaan) for ' + (x.e - x.s) + ' s:' : 'Wrong Shabad for ' + (x.e - x.s) + ' s:'} <span class="g">${esc(x.shown >= 0 ? label(d.texts[x.shown]) : '')}</span>${f.find == null ? ` for ${x.e - x.s} s` : ''}` });
    for (const x of f.blank) if (!(f.find == null && x.s === f.start)) ev.push({ s: x.s, who, kind: 'none', text: `Nothing on screen for ${x.e - x.s} s` });

  const at = (cc, s) => { if (!cc) return null; let lo = 0, hi = cc.runs.length - 1; while (lo <= hi) { const m = (lo + hi) >> 1, r = cc.runs[m]; if (s < r[0]) hi = m - 1; else if (s >= r[1]) lo = m + 1; else return r; } return null; };
  const mark = (r) => (!r ? '' : r[2] === 'P' || r[2] === 'S' ? '<span class="tag" style="background:var(--ok)">right</span>' : r[2] === 'B' ? '<span class="tag" style="background:var(--ok)">right Bani</span>' : r[2] === 'A' ? '<span class="tag" style="background:var(--bad)">wrong pangti</span>' : r[2] === 'W' ? '<span class="tag" style="background:var(--bad)">wrong</span>' : r[2] === 'V' ? '<span class="tag" style="background:var(--faint)">Waheguru slide</span>' : r[2] === 'G' ? '<span class="tag" style="background:var(--faint)">no pangti said, fine</span>' : '<span class="tag" style="background:var(--faint)">nothing</span>');

  // in-page player (public YouTube recordings): the timeline follows the audio
  let P = null; clearInterval(window.__gabTick);
  const playing = () => (AU ? !AU.paused : P && P.getPlayerState && P.getPlayerState() === 1);
  if (AU) {
    const tick = () => { if (!document.body.contains(AU)) return; if (!AU.paused) showAt(AU.currentTime); requestAnimationFrame(tick); };
    AU.addEventListener('play', () => requestAnimationFrame(tick)); AU.addEventListener('seeked', () => showAt(AU.currentTime));
  } else if (c.yt) {
    ytReady(() => {
      P = new YT.Player('ytp', { videoId: c.yt.v, playerVars: { start: c.yt.at, rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
        events: { onError: () => { failed = true; const box = document.querySelector('.player'); document.querySelectorAll('.playnote').forEach((x) => x.remove()); if (box) box.outerHTML = `<p class="playnote">YouTube would not play this video inside the page. <a href="${yt(0)}" target="_blank" rel="noopener">Open it on YouTube</a>; the play buttons below open YouTube at that moment.</p>`; } } });
      window.__gabPlayer = P;
      window.__gabTick = setInterval(() => { if (!document.getElementById('ytp') && !document.querySelector('.player iframe')) { clearInterval(window.__gabTick); return; }
        if (playing()) { const s = P.getCurrentTime() - c.yt.at; if (s >= 0 && s < c.dur) showAt(s); } }, 250);
    });
  }
}
// YouTube IFrame API, loaded once on first use
let __ytQ = null;
function ytReady(fn) {
  if (window.YT && YT.Player) return fn();
  if (!__ytQ) { __ytQ = []; window.onYouTubeIframeAPIReady = () => __ytQ.splice(0).forEach((f) => f());
    const t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t); }
  __ytQ.push(fn);
}
let HAS = null; // which categories appear in the current view
function legend(keyed, short) {
  const it = (c, t) => `<span><i class="sw" style="background:${c}"></i>${t}</span>`;
  const has = (k) => !HAS || HAS.has(k);
  return it('var(--ok)', keyed ? 'right pangti' : 'right Shabad') + (has('B') ? it('var(--okb)', 'right Bani (contains the Shabad)') : '')
    + it('var(--bad)', keyed ? 'wrong pangti (another pangti of the same Shabad, or another Shabad)' : 'wrong Shabad') + (has('V') ? it('var(--wg)', 'Waheguru slide (searching)') : '')
    + it('var(--none)', 'nothing shown') + (has('G') ? it('var(--gap)', 'no pangti being said (screen fine)') : '') + (short ? '' : '<span><i class="sw" style="background:var(--unscored);border:1px solid var(--line)"></i>not scored (no answer key)</span>');
}
function about() {
  return `<details class="about"><summary>How this is scored</summary>
    <p>Each recording is split into seconds. For every second we compare what was being sung (the answer key) with what Voice Autopilot had on screen: <b>right</b> (or the screen moved there less than 1 s ago), <b>right Bani</b> (a Bani such as Aarti or Rehras Sahib that contains the Shabad being sung, checked against BaniDB), <b>other pangti</b> of the right Shabad, <b>wrong Shabad</b>, the <b>Waheguru slide</b> while it searches (not an error, but not counted as right), or <b>nothing shown</b>. A short wrong stretch that returns to the right Shabad is marked “possibly a parmaan”; it still counts as wrong in the numbers. Seconds without an answer key (lead-in, katha, silence) are not scored. Recordings with a person-checked pangti key are judged on the exact pangti; the others on the Shabad.</p>
    <p>"Time to find" is how long after the singing starts the right Shabad first appears. Only public recordings (YouTube) are shown; the held-out test set is never shown.</p>
    <p>The second-by-second view follows Karanbir Singh's <a href="https://github.com/karanbirsingh/live-gurbani-captioning-benchmark-v1">Live Captioning for Gurbani Kirtan benchmark</a> and its <a href="https://karanbirsingh.github.io/live-gurbani-captioning-benchmark-v1/perfect.html">visualizations</a>, with thanks. <a href="./about.html">More about the benchmark</a>.</p></details>`;
}
main().catch((e) => { $('#app').innerHTML = `<p class="empty">Could not load the results (${esc(e.message)}).</p>`; });
