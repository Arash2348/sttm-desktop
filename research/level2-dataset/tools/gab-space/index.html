<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAB Leaderboard</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6962; --line: #e4e1d8; --sub: #f6f4ef;
  --app: #1f5f8b; --app-soft: #e6eff6;
  --better-ink: #13703b; --worse-ink: #b0241c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a9a69c; --line: #34332f; --sub: #252522;
    --app: #9cc8ea; --app-soft: #1f2d38; --better-ink: #7fd89e; --worse-ink: #f48a7e; }
}
:root[data-theme="dark"] { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a9a69c; --line: #34332f; --sub: #252522;
  --app: #9cc8ea; --app-soft: #1f2d38; --better-ink: #7fd89e; --worse-ink: #f48a7e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.page { max-width: 940px; margin: 0 auto; padding: 18px 16px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.ver { cursor: pointer; }
tr.ver:hover td:first-child, tr.ver:focus-visible td:first-child { background: var(--sub); }
tr.ver:focus-visible { outline: 2px solid var(--app); outline-offset: -2px; }
td.nm { font-weight: 600; }
td.nm .car { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; transition: transform .15s; }
tr.open td.nm .car { transform: rotate(90deg); }
td.nm .what { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin: 1px 0 0 14px; }
.ch { font-size: 11px; font-weight: 600; margin-left: 3px; }
.ch.up { color: var(--better-ink); } .ch.dn { color: var(--worse-ink); }
tr.idea td.nm { font-weight: 500; color: var(--muted); }
tr.old td.nm { font-weight: 400; }
.pill { display: inline-block; margin-left: 6px; border-radius: 999px; padding: 0 7px; font-size: 10px; font-weight: 600; line-height: 16px; vertical-align: 1px; white-space: nowrap; background: var(--app-soft); color: var(--app); border: 1px solid var(--app); }
td.v { font-size: 15px; white-space: nowrap; width: 10%; }
tr.det > td { padding: 0 12px 12px 26px; background: var(--sub); text-align: left; }
.sd { width: 100%; font-size: 13px; }
.sd th, .sd td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sd th { font-size: 12px; }
.sd td.none { color: var(--muted); font-size: 12px; }
.sd td { width: 26%; white-space: nowrap; } .sd td:first-child { width: auto; white-space: normal; }
.sd tr.node { cursor: pointer; }
.sd .tw { display: inline-block; width: 16px; background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; text-align: left; }

/* ---- timeline spine, content-colour bars, change-type chips ---- */
:root { --k: #d9822b; --p: #3b7dd8; --s: #8a5cc7; --spine: #cfcac0;
  --t-acc: #2f8f83; --t-spd: #3b7dd8; --t-pc: #b7791f; --t-ui: #8a5cc7; --t-inf: #7a7a72; --t-new: #c2507a; --app-dot: #1f5f8b; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --k: #e9a050; --p: #6aa0ec; --s: #ab86e0; --spine: #4a4843; --app-dot: #9cc8ea;
  --t-acc: #5cc3b5; --t-spd: #6aa0ec; --t-pc: #d9a24a; --t-ui: #ab86e0; --t-inf: #a3a39a; --t-new: #e07fa3; } }
:root[data-theme="dark"] { --k: #e9a050; --p: #6aa0ec; --s: #ab86e0; --spine: #4a4843; --app-dot: #9cc8ea;
  --t-acc: #5cc3b5; --t-spd: #6aa0ec; --t-pc: #d9a24a; --t-ui: #ab86e0; --t-inf: #a3a39a; --t-new: #e07fa3; }
.ch { display: inline-block; border-radius: 999px; padding: 0 6px; line-height: 16px; font-size: 10.5px; vertical-align: 1px; }
.ch.up { background: color-mix(in srgb, var(--better-ink) 14%, var(--panel)); } .ch.dn { background: color-mix(in srgb, var(--worse-ink) 14%, var(--panel)); }
.chips { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
.chip { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 0 6px; line-height: 16px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--panel)); white-space: nowrap; }
.grp th { border-bottom: 0; padding-bottom: 0; font-size: 12px; color: var(--ink); }
.grp th.g { text-align: center; border-bottom: 2px solid var(--line); }
.grp th.g span { font-weight: 400; color: var(--muted); }
th .u { display: block; font-weight: 400; font-size: 11px; }
th.s, td.s { background: color-mix(in srgb, var(--app-dot) 3%, var(--panel)); }
th.s:not(.g) + th.s, td.s + td.s { }
td.v.s { font-size: 14px; color: var(--ink); }
td.v.s:first-of-type { }
.sd td.spd { color: var(--muted); font-size: 12px; text-align: left; }
td.nm, th.vh { text-align: left !important; }
.items { padding: 10px 0 6px; display: grid; gap: 5px; }
.item { font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.item .chips { margin-left: 0; }
.item .ichg { font-size: 11px; color: var(--muted); }
.item .cm { margin-left: auto; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
/* timeline spine */
td.tl, th.tl { width: 26px; padding: 0 0 0 14px !important; position: relative; }
td.tl::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: var(--spine); }
tbody tr:first-child td.tl::before { top: 50%; }
tbody tr.lastver td.tl::before { bottom: 50%; }
tr.det td.tl::before { bottom: 0 !important; }
.dot { position: absolute; left: 16px; top: 50%; margin-top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--ink); }
tr.idea .dot { background: var(--panel); box-shadow: 0 0 0 1.5px var(--muted); border: 2px dashed var(--muted); box-shadow: none; }
tr.old .dot { background: var(--muted); box-shadow: 0 0 0 1px var(--muted); }
tr.now .dot { background: var(--app-dot); box-shadow: 0 0 0 4px color-mix(in srgb, var(--app-dot) 25%, var(--panel)); width: 16px; height: 16px; margin-top: -8px; left: 15px; }
tr.now td { background: color-mix(in srgb, var(--app-dot) 4%, var(--panel)); }
/* bars */
.bar { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--c) 12%, var(--panel)); margin-top: 4px; min-width: 90px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c); opacity: .85; }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
tr.idea .bar > i { background: repeating-linear-gradient(135deg, var(--c) 0 4px, color-mix(in srgb, var(--c) 45%, var(--panel)) 4px 7px); }
th .hdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: 0; }
.sd td.k1 { box-shadow: inset 3px 0 0 var(--c); }
@media (max-width: 560px) {
  .page { padding: 16px 12px; }
  th, td { padding: 8px 6px; }
  td.v { font-size: 14px; }
  td.nm .sysn { display: none; }
  th { white-space: normal; }
  tr.det > td { padding: 0 6px 10px 6px; }
  /* phone: the table scrolls inside its box; spine and name stay put */
  .box { overflow-x: auto; }
  #board { min-width: 720px; }
  td.tl, th.tl { position: sticky; left: 0; z-index: 2; background: var(--panel); min-width: 30px; width: 30px; }
  tbody tr.ver td.nm, thead th.vh { position: sticky; left: 30px; z-index: 2; background: var(--panel); min-width: 120px; max-width: 130px; white-space: normal; box-shadow: 1px 0 0 var(--line); }
  tr.now td.tl, tr.now td.nm { background: color-mix(in srgb, var(--app-dot) 4%, var(--panel)); }
  tr.det td.tl { background: var(--sub); }
  .det .sd, .det .items { max-width: 340px; position: sticky; left: 36px; }
  .bar { min-width: 60px; }
}
</style>
</head>
<body>
<div class="page">
  <h1>GAB: Gurbani Autopilot Bench</h1>
  <p class="sub">▲▼ change vs the version before, shown only beyond noise · tap a version for what went into it</p>
  <div class="box"><table id="board"></table></div>
</div>
<script>
let SYSTEM = { latin: 'Gurbani Autopilot' };
// headline: right Shabad/Bani % per behaviour, main GAB (Gurdwara mic)
const HEAD = [
  { t: 'Kirtan', key: '1-kirtan-shabad' },
  { t: 'Paath', key: '2-bani-recited' },
  { t: 'Sung Bani', key: '3-bani-sung-like-kirtan' },
];
// expanded view: a tree built from the scorecard rows (behaviour -> mic -> Bani -> mic type), no fixed list
const BEH_NAME = { '1-kirtan-shabad': 'Kirtan', '2-bani-recited': 'Paath (recited Bani)', '3-bani-sung-like-kirtan': 'Aarti and sung Bani', '4-akhand-paath': 'Akhand Paath' };
const BANI = { japji: 'Japji Sahib', jaap: 'Jaap Sahib', 'tav-prasad-savaiye': 'Tav Prasad Savaiye', chaupai: 'Chaupai Sahib', 'anand-40': 'Anand Sahib', anand: 'Anand Sahib', rehras: 'Rehras Sahib', sohila: 'Kirtan Sohila', sukhmani: 'Sukhmani Sahib', saloks: 'Saloks', aarti: 'Aarti', 'asa-di-vaar': 'Asa di Vaar' };
const MIC = { 'mixer-feed': 'Mixer feed', 'room-mic': 'Room mic', studio: 'Studio', unknown: 'Mic not known' };
// Nitnem order first, then anything new (alphabetical)
const ORDER = ['japji', 'jaap', 'tav-prasad-savaiye', 'chaupai', 'anand-40', 'anand', 'rehras', 'sohila', 'sukhmani', 'saloks', 'aarti', 'asa-di-vaar'];
const ord = (slug) => { const i = ORDER.indexOf(slug); return i < 0 ? 99 : i; };
const nice = (slug) => BANI[slug] || slug.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase());
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kindOf = (r) => r.kind || (r.status === 'merged' ? 'release' : 'experiment');
const rowOf = (rows, key) => (rows || []).find((x) => x.key === key && x.clips) || null;
const pct = (res, key) => { const r = rowOf(res.rows, key); return r && r.right_shabad_pct != null ? Number(r.right_shabad_pct) : null; };
let RESULTS = []; let WHY = {};
const TCOL = { Accuracy: '--t-acc', Speed: '--t-spd', 'Slow PCs': '--t-pc', 'Panel/UI': '--t-ui', Infrastructure: '--t-inf', 'New behaviour': '--t-new' };
const HCOL = { '1-kirtan-shabad': '--k', '2-bani-recited': '--p', '3-bani-sung-like-kirtan': '--s' };
let TYPEOF = {};
const chipsOf = (res) => { const t = TYPEOF[String(res.commit).slice(0, 8)] || []; return t.length ? `<span class="chips">${t.map((x) => `<span class="chip" style="--c: var(${TCOL[x] || '--t-inf'})">${esc(x)}</span>`).join('')}</span>` : ''; };
const SPINE = true; const CHIPS = true; const BARS = true;

// change vs the version before it (an idea: vs its base); shown only above the noise floor
const FLOOR = { pct: 0.3, wrong: 3, sec: 0.5 };
function chg(v, b, kind) {
  if (v == null || b == null) return '';
  const d = Math.round((v - b) * 10) / 10;
  if (Math.abs(d) <= FLOOR[kind]) return '';
  const better = kind === 'pct' ? d > 0 : d < 0; // wrong s/h and seconds: lower is better
  return ` <span class="ch ${better ? 'up' : 'dn'}" title="${better ? 'better' : 'worse'} than the version before (${b})">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d)}</span>`;
}
let PREV = new Map();
// speed: typical seconds, lower is better. Behind only on human or ear-checked line answers (>= 3 clips), else '–'
const sv = (res, key, k, need) => { const r = rowOf(res.rows, key); if (!r || r[k] == null || (need && !need(r))) return null; return Number(r[k]); };
const behindOk = (r) => r.pangti_basis && r.pangti_basis !== 'aligned' && r.pangti_clips >= 3;
const SPEED = [
  { t: 'Find', sub: 'kirtan', tip: 'typical seconds until the right Shabad is first shown (kirtan)', get: (res) => sv(res, '1-kirtan-shabad', 'find_p50_s') },
  { t: 'Switch', sub: 'sung Bani', tip: 'typical seconds to the new Shabad or Bani after a change, e.g. Rehras Sahib to Aarti', get: (res) => sv(res, '3-bani-sung-like-kirtan', 'switch_p50_s', (r) => r.switch_n > 0) },
  { t: 'Behind', sub: 'paath', tip: 'typical seconds behind the reader; fills in once paath line answers are in the practice set', get: (res) => sv(res, '2-bani-recited', 'behind_p50_s', behindOk) },
];
const speedTxt = (r) => { if (!r) return ''; const p = []; if (r.find_p50_s != null) p.push(`find ${r.find_p50_s} s`); if (r.switch_n && r.switch_p50_s != null) p.push(`switch ${r.switch_p50_s} s`); if (behindOk(r) && r.behind_p50_s != null) p.push(`behind ${r.behind_p50_s} s`); return p.join(' · '); };


const verOf = (res) => (res.vf_feature_version && kindOf(res) === 'release' ? res.vf_feature_version : String(res.label || res.name).split(' · ')[0].split(' + ')[0]);
function nameCell(g, isNow) {
  const res = g.rep; const idea = kindOf(res) === 'experiment';
  const nm = idea ? `Idea: ${esc(String(res.label || res.name).split(' · ')[0])}` : `<span class="sysn">${esc(SYSTEM.latin)} </span>${esc(g.ver)}`;
  return `<td class="nm"><span class="car">▶</span>${nm}${isNow ? '<span class="pill">in the app now</span>' : ''}</td>`;
}
// what went into a version: one line per build, with its chips and any change beyond noise vs the build before it
function itemsHtml(g) {
  return g.builds.map((res) => {
    const c8 = String(res.commit).slice(0, 8);
    const lab = String(res.label || res.name); const short = lab.includes(' · ') ? lab.split(' · ').slice(1).join(' · ') : lab.includes(' + ') ? lab.split(' + ').slice(1).join(' + ') : kindOf(res) === 'experiment' ? '' : 'release';
    const why = WHY[c8] || '';
    const text = why && short && why.toLowerCase().startsWith(short.toLowerCase()) ? why : [short, why].filter(Boolean).join(': ');
    const pv = PREV_BUILD.get(res); const ch = [];
    if (pv) for (const c of HEAD) {
      const a = rowOf(res.rows, c.key); const b = rowOf(pv.rows, c.key);
      if (has(a) && has(b)) {
        const x = chg(Number(a.right_shabad_pct), Number(b.right_shabad_pct), 'pct'); if (x) ch.push(`${c.t}${x}`);
        const y = chg(Number(a.wrong_s_per_h), Number(b.wrong_s_per_h), 'wrong'); if (y) ch.push(`${c.t} wrong${y}`);
      }
    }
    return `<div class="item"><span class="itxt">${esc(text)}</span>${chipsOf(res)}${ch.length ? `<span class="ichg">${ch.join(' ')}</span>` : ''}<span class="cm" title="${esc(lab)}">${c8}</span></div>`;
  }).join('');
}
let PREV_BUILD = new Map(); let CUR_G = null;
const has = (r) => !!(r && r.clips && r.right_shabad_pct != null);
// mic types inside one scorecard row (only when there is more than one real type)
function micKids(path, r) {
  const ks = Object.keys((r && r.mic) || {}).filter((k) => k !== '50/50' && r.mic[k] && r.mic[k].clips);
  return ks.length > 1 ? ks.map((k) => ({ id: `${path}|mic:${k}`, name: MIC[k] || k, row: r.mic[k], kids: [] })) : [];
}
function banisOf(rows, beh, path) {
  return (rows || []).filter((x) => x.level === 'bani' && x.key.startsWith(`${beh}/`)).sort((a, b) => has(b) - has(a) || ord(a.key.slice(beh.length + 1)) - ord(b.key.slice(beh.length + 1)) || a.key.localeCompare(b.key)).map((x) => ({ id: `${path}|${x.key}`, name: nice(x.key.slice(beh.length + 1)), row: x, kids: has(x) ? micKids(`${path}|${x.key}`, x) : [] }));
}
function tree(res) {
  const main = res.rows || []; const hard = (res.hard || {}).rows || [];
  const behs = [...new Set([...main, ...hard].filter((x) => x.level === 'behaviour').map((x) => x.key))].sort();
  return behs.map((k) => {
    const m = main.find((x) => x.key === k); const h = hard.find((x) => x.key === k);
    const inc = (r) => !!(r && r.incomplete); // not scored: needs speech-model output not in the cache
    const node = { id: k, name: BEH_NAME[k] || (m || h).title, row: has(m) || inc(m) ? m : has(h) ? h : null, kids: [] };
    if (has(h) || inc(h)) {
      // two mics: Gurdwara mic (main GAB) and Laptop mic (GAB-Hard), each with its own Banis / mic types
      node.kids = [
        { id: `${k}|gurdwara`, name: 'Gurdwara mic', row: has(m) || inc(m) ? m : null, kids: has(m) ? (banisOf(main, k, `${k}|gurdwara`).length ? banisOf(main, k, `${k}|gurdwara`) : micKids(`${k}|gurdwara`, m)) : [] },
        { id: `${k}|laptop`, name: 'Laptop mic', row: h, kids: has(h) ? banisOf(hard, k, `${k}|laptop`) : [] },
      ];
    } else if (has(m)) node.kids = banisOf(main, k, k).length ? banisOf(main, k, k) : micKids(k, m);
    return node;
  });
}
const walk = (nodes, f, d = 0) => nodes.forEach((n) => { f(n, d); walk(n.kids, f, d + 1); });
function nodeCells(n, pn) {
  if (n.row && n.row.incomplete) return `<td class="none" colspan="2" title="${esc(n.row.note || '')}">not scored: ${n.row.incomplete} recording${n.row.incomplete > 1 ? 's need' : ' needs'} speech-model output this version asks for, not saved yet</td>`;
  if (!has(n.row)) return `<td class="none" colspan="3">${n.raw && n.raw.incomplete ? 'not scored yet' : 'no recordings yet'}</td>`;
  const r = Number(n.row.right_shabad_pct); const w = Number(n.row.wrong_s_per_h);
  const p = pn && has(pn.row) ? pn.row : null;
  return `<td>${r}%${chg(r, p ? Number(p.right_shabad_pct) : null, 'pct')}</td><td>${w}${chg(w, p ? Number(p.wrong_s_per_h) : null, 'wrong')}</td><td class="spd">${esc(speedTxt(n.row)) || '–'}</td>`;
}
function detail(res) {
  const out = []; const pv = PREV.get(res); const pnodes = {};
  if (pv) walk(tree(pv), (n) => { pnodes[n.id] = n; });
  walk(tree(res), (n, d) => {
    const open = n.kids.length && has(n.row) || n.kids.length;
    const kid = d ? ` data-p="${esc(n.id.split('|').slice(0, -1).join('|') || n.id)}" hidden` : '';
    const hc = HCOL[n.id.split('|')[0].split('/')[0]];
    out.push(`<tr class="node"${kid} data-id="${esc(n.id)}"><td class="${hc ? 'k1' : ''}" style="padding-left:${6 + d * 16}px;${hc ? `--c: var(${hc})` : ''}">${open ? `<button type="button" class="tw" aria-expanded="false">▸</button>` : '<span class="tw"></span>'}${esc(n.name)}</td>${nodeCells(n, pnodes[n.id])}</tr>`);
  });
  return `${CUR_G ? `<div class="items">${itemsHtml(CUR_G)}</div>` : ''}<table class="sd"><thead><tr><th></th><th>Right</th><th>Wrong (s/h)</th><th>Speed</th></tr></thead><tbody>${out.join('')}</tbody></table>`;
}
function render() {
  const byOrd = (a, b) => (a.order ?? -99) - (b.order ?? -99) || String(a.date).localeCompare(String(b.date));
  const rank = { 'older version': 0, release: 1 };
  const vers = RESULTS.filter((x) => kindOf(x) !== 'experiment').sort((a, b) => (rank[kindOf(a)] ?? 1) - (rank[kindOf(b)] ?? 1) || byOrd(a, b));
  PREV_BUILD = new Map(); vers.forEach((x, i) => { if (i) PREV_BUILD.set(x, vers[i - 1]); });
  // one row per version number (its last build carries the numbers), oldest first here
  const groups = [];
  for (const x of vers) { const v = verOf(x); const g = groups.length && groups[groups.length - 1].ver === v ? groups[groups.length - 1] : null; if (g) { g.builds.push(x); g.rep = x; } else groups.push({ ver: v, builds: [x], rep: x }); }
  PREV = new Map(); groups.forEach((g, i) => { if (i) PREV.set(g.rep, groups[i - 1].rep); });
  const ideas = RESULTS.filter((x) => kindOf(x) === 'experiment').sort(byOrd).reverse().map((x) => {
    const b = x.base && RESULTS.find((y) => y !== x && String(y.commit).startsWith(String(x.base).slice(0, 8)));
    if (b) { PREV.set(x, b); PREV_BUILD.set(x, b); }
    return { ver: null, builds: [x], rep: x };
  });
  const nowG = [...groups].reverse().find((g) => kindOf(g.rep) === 'release');
  const rows = [...ideas, ...groups.reverse()];
  const list = rows.map((g) => g.rep);
  const cell = (res, c) => {
    const v = pct(res, c.key); if (v == null) return '<td class="v" title="not scored yet">–</td>';
    const pv = PREV.get(res); const b = pv ? pct(pv, c.key) : null;
    const bar = BARS ? `<div class="bar" style="--c: var(${HCOL[c.key]})"><i style="width:${v}%"></i>${b != null ? `<b style="left:calc(${b}% - 1px)" title="version before: ${b}%"></b>` : ''}</div>` : '';
    return `<td class="v">${v}%${chg(v, b, 'pct')}${bar}</td>`;
  };
  const scell = (res, c) => {
    const v = c.get(res); if (v == null) return `<td class="v s" title="${esc(c.tip)}">–</td>`;
    const pv = PREV.get(res); const b = pv ? c.get(pv) : null;
    return `<td class="v s" title="${esc(c.tip)}">${v} s${chg(v, b, 'sec')}</td>`;
  };
  const tl = (cls = '') => (SPINE ? `<td class="tl ${cls}">${cls === 'd' ? '' : '<span class="dot"></span>'}</td>` : '');
  const body = rows.map((g, i) => { CUR_G = g; const res = g.rep; const isNow = g === nowG;
    return `<tr class="ver ${{ experiment: 'idea', 'older version': 'old' }[kindOf(res)] || ''}${isNow ? ' now' : ''}${i === rows.length - 1 ? ' lastver' : ''}" data-i="${i}" tabindex="0" aria-expanded="false">${tl()}${nameCell(g, isNow)}${HEAD.map((c) => cell(res, c)).join('')}${SPEED.map((c) => scell(res, c)).join('')}</tr><tr class="det" hidden>${tl('d')}<td colspan="${HEAD.length + SPEED.length + 1}">${detail(res)}</td></tr>`; }).join('');
  CUR_G = null;
  document.getElementById('board').innerHTML = `<thead><tr class="grp">${SPINE ? '<th class="tl"></th>' : ''}<th></th><th colspan="${HEAD.length}" class="g">Accuracy <span>right %</span></th><th colspan="${SPEED.length}" class="g s">Speed <span>seconds, lower is better</span></th></tr><tr>${SPINE ? '<th class="tl"></th>' : ''}<th class="vh">Version</th>${HEAD.map((c) => `<th style="--c: var(${HCOL[c.key]})">${BARS ? '<span class="hdot"></span>' : ''}${c.t}</th>`).join('')}${SPEED.map((c) => `<th class="s" title="${esc(c.tip)}">${c.t}<span class="u">${c.sub}</span></th>`).join('')}</tr></thead><tbody>${body}</tbody>`;
  const q = new URLSearchParams(location.search).get('open');
  if (q) document.querySelectorAll('tr.ver').forEach((tr) => { if (rows[tr.dataset.i] && rows[tr.dataset.i].builds.some((x) => String(x.commit).startsWith(q))) toggle(tr); });
}
// open: show direct children; close: hide every descendant
function setNode(tr, on) {
  const b = tr.querySelector('button.tw'); b.setAttribute('aria-expanded', String(on)); b.textContent = on ? '▾' : '▸';
  const tb = tr.closest('tbody'); const id = tr.dataset.id;
  tb.querySelectorAll('tr.node').forEach((x) => {
    if (x.dataset.p === id) x.hidden = !on;
    else if (!on && x.dataset.id.startsWith(`${id}|`)) { x.hidden = true; const bb = x.querySelector('button.tw'); if (bb) { bb.setAttribute('aria-expanded', 'false'); bb.textContent = '▸'; } }
  });
}
function toggle(tr) {
  const d = tr.nextElementSibling; d.hidden = !d.hidden;
  tr.classList.toggle('open', !d.hidden); tr.setAttribute('aria-expanded', String(!d.hidden));
}
document.getElementById('board').addEventListener('click', (e) => {
  const b = e.target.closest('button.tw');
  if (b) { const tr = b.closest('tr'); const on = b.getAttribute('aria-expanded') !== 'true'; setNode(tr, on); return; }
  if (e.target.closest('tr.node')) { const t = e.target.closest('tr.node').querySelector('button.tw'); if (t) t.click(); return; }
  const tr = e.target.closest('tr.ver'); if (tr) toggle(tr);
});
document.getElementById('board').addEventListener('keydown', (e) => { const tr = e.target.closest('tr.ver'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); } });
(async () => {
  try { const N = await (await fetch('gab-names.json', { cache: 'no-store' })).json(); if (N.system) SYSTEM = N.system; TYPEOF = Object.fromEntries(Object.entries(N.builds || {}).filter(([, b]) => b.type).map(([c, b]) => [c, [].concat(b.type)])); WHY = Object.fromEntries(Object.entries(N.builds || {}).map(([c, b]) => [c, b.why || ''])); } catch (e) { /* fallback name */ }
  try {
    const idx = await (await fetch('results/index.json', { cache: 'no-store' })).json();
    RESULTS = await Promise.all(idx.results.map(async (x) => ({ ...x, ...(await (await fetch(`results/${x.file}`, { cache: 'no-store' })).json()) })));
    render();
  } catch (e) { document.getElementById('board').innerHTML = '<tr><td>Could not load results.</td></tr>'; }
})();
</script>
