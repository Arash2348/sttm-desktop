name: vf-hw-timing
# Voice-Follow research: real model cost on GitHub's small runners (4 vCPU = 2 cores, no GPU),
# a stand-in for i3/i5-class PCs. Today's windows vs hear-once. No audio, public model only.
on:
  workflow_dispatch:
  push:
    branches: [vf-hear-once]
    paths: ['research/hear-once/hw-timing.js', '.github/workflows/vf-hw-timing.yml']
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, pin: '', label: linux-4vcpu }
          - { os: ubuntu-latest, pin: '0,1', label: linux-2vcpu }
          - { os: windows-latest, pin: '', label: windows-4vcpu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            www/main/addons/voice-follow/engine
            research/hear-once
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: onnxruntime-node only
        shell: bash
        run: mkdir -p ../ortdeps && cd ../ortdeps && npm init -y >/dev/null && npm i onnxruntime-node@1.30.0 >/dev/null
      - name: model (public, same file the app downloads)
        shell: bash
        run: curl -sSL -o ../model.int8.onnx 'https://huggingface.co/karansea/indicconformer-stt-pa-ctc-shabad-preview/resolve/main/model.int8.onnx?download=true' && ls -l ../model.int8.onnx
      - name: timing
        shell: bash
        env: { THREADS: '1,2,3,4', N: '15' }
        run: |
          export NODE_PATH=$(cd ../ortdeps/node_modules && pwd)
          export MODEL=$(cd .. && pwd)/model.int8.onnx
          if [ -n "${{ matrix.pin }}" ]; then PRE="taskset -c ${{ matrix.pin }}"; fi
          nproc 2>/dev/null; lscpu 2>/dev/null | grep -E 'Model name|Thread|Core|Socket' || true
          $PRE node research/hear-once/hw-timing.js timing-${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.label }}
          path: timing-${{ matrix.label }}.json
