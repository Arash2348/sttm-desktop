# Plain MVP 8.6c installers (Cycle 8 + same-Gurbani lock + Sundar Gutka paath following, the
# normal Voice-Follow panel, no tester/shadow layer). Built the way Khalis builds releases
# (see build-windows.yml / build-mac.yml) with these deliberate differences: no code signing
# or notarization, no publishing, the speech model bundled, and the installers kept as
# workflow artifacts. The Mac app is ad-hoc signed and packed into a DMG by hand because
# electron-builder's unsigned DMG fails Gatekeeper outright ("damaged") on other Macs.
name: Release build (8.6c)

on:
  push:
    branches:
      - mvp-8.6c-release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 (Visual Studio 2022) is the proven recipe: Node 18 and the lockfile's
          # node-gyp 9. GitHub sometimes cannot provision it ("not acquired by Runner of type
          # hosted"), so windows-2025 (Visual Studio 2026 only) runs as well, with Node 20 and
          # node-gyp 12, the oldest node-gyp that knows VS 2026 (none that knows it runs on
          # Node 18). Either Windows job yields the installer.
          - os: windows-2022
            platform: win
            node: '18.18.0'
          - os: windows-2025
            platform: win
            node: '20.19.0'
            gyp: '12'
          - os: macos-14
            platform: macArm
            node: '18.18.0'
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BONJOUR_SDK_HOME: 'C:\Program Files\Bonjour SDK'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (node-gyp compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure setuptools (distutils replacement)
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Set node-gyp Python path
        shell: bash
        run: echo "npm_config_python=$pythonLocation/python${{ matrix.platform == 'win' && '.exe' || '3' }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Bonjour SDK
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/Bonjour64.msi" -OutFile "Bonjour64.msi"
          Start-Process msiexec.exe -ArgumentList "/i Bonjour64.msi /qn" -Wait
          Remove-Item Bonjour64.msi
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/bonjoursdksetup.exe" -OutFile "bonjoursdksetup.exe"
          Start-Process bonjoursdksetup.exe -ArgumentList "/quiet" -Wait
          Remove-Item bonjoursdksetup.exe

      - name: Install dependencies
        if: '!matrix.gyp'
        shell: bash
        run: |
          npm install -g npm@9.8.1
          npm install --legacy-peer-deps

      # Visual Studio 2026 runner: npm's and the tree's node-gyp must both be a version that
      # knows VS 2026, so install without scripts, swap in node-gyp, then run the native builds.
      - name: Install dependencies (node-gyp ${{ matrix.gyp }} for Visual Studio 2026)
        if: matrix.gyp
        shell: bash
        run: |
          npm install -g npm@9.8.1 node-gyp@${{ matrix.gyp }}
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
          export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          npm install --legacy-peer-deps --ignore-scripts
          npm install --no-save --legacy-peer-deps --ignore-scripts node-gyp@${{ matrix.gyp }}
          node -e 'console.log("tree node-gyp", require("node-gyp/package.json").version)'
          npm rebuild
          npx electron-builder install-app-deps

      - name: Speech model (bundled into the installer)
        shell: bash
        run: |
          mkdir -p build-resources/voice-follow
          curl -L --retry 3 -o build-resources/voice-follow/model.int8.onnx \
            "https://huggingface.co/karansea/indicconformer-stt-pa-ctc-shabad-preview/resolve/main/model.int8.onnx?download=true"
          SIZE=$(wc -c < build-resources/voice-follow/model.int8.onnx | tr -d ' ')
          echo "model bytes: $SIZE"; test "$SIZE" -gt 180000000

      - name: Build (npm run build, as pack:* does)
        shell: bash
        run: npm run build

      - name: Sanity checks on the source build
        shell: bash
        run: |
          node -e 'const p=require("./node_modules/anvaad-js/package.json");if(p.version<"1.5.1")process.exit(1);console.log("anvaad-js",p.version)'
          test "$(grep -c SHADOW_BUILD www/js/addons/voice-follow/components/VoiceFollow.js 2>/dev/null || true)" = 0
          grep -q loadBaniIndex www/js/addons/voice-follow/components/VoiceFollow.js

      # npmRebuild=false: the postinstall already built the native modules for Electron, and
      # electron-builder's second rebuild stalls on GitHub's runners while fetching sharp.
      - name: Package (Windows, as pack:win)
        if: matrix.platform == 'win'
        timeout-minutes: 60
        shell: bash
        run: npx electron-builder --win --x64 --publish never -c.npmRebuild=false

      - name: Package (macOS Apple Silicon app folder, package.json config)
        if: matrix.platform == 'macArm'
        timeout-minutes: 60
        shell: bash
        run: npx electron-builder --mac dir --arm64 --publish never -c.npmRebuild=false

      - name: Sign ad hoc and make the DMG (macOS)
        if: matrix.platform == 'macArm'
        shell: bash
        run: |
          APP=$(ls -d builds/mac-arm64/*.app | head -1); echo "APP $APP"
          rm -rf "$APP/Contents/Resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/linux" \
                 "$APP/Contents/Resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/win32"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(node -p "require('./package.json').version")
          STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "SikhiToTheMax" -srcfolder "$STAGE" -ov -format UDZO "builds/SikhiToTheMax-8.6c-${VERSION}-mac-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/vol "builds/SikhiToTheMax-8.6c-${VERSION}-mac-arm64.dmg"
          codesign --verify --deep --strict /tmp/vol/*.app && echo "DMG app signature OK"
          hdiutil detach /tmp/vol

      - name: Checks on the output
        shell: bash
        run: |
          ls -la builds/ | grep -E "\.exe$|\.dmg$"
          if [ "${{ matrix.platform }}" = win ]; then
            test -f builds/win-unpacked/resources/voice-follow/model.int8.onnx
            file builds/win-unpacked/resources/app.asar.unpacked/node_modules/realm/build/Release/realm.node | grep -q "PE32+"
            for f in builds/*.exe; do mv "$f" "builds/SikhiToTheMax-8.6c-$(basename "$f" | sed 's/SikhiToTheMaxSetup-//')"; done
            ls builds/*.exe
          else
            ls builds/mac-arm64/*.app/Contents/Resources/voice-follow/model.int8.onnx
            file builds/mac-arm64/*.app/Contents/Resources/app.asar.unpacked/node_modules/realm/build/Release/realm.node | grep -q "arm64"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sttm-8.6c-${{ matrix.os }}
          path: |
            builds/*.exe
            builds/*.dmg
          if-no-files-found: error
          retention-days: 30
