name: YAMNet hardware check

# Test-only branch: does the speech-music classifier (engine/speech-music.js) load and give the same
# scores on Windows x64 and ARM64 Linux (Raspberry Pi class) as on the reference Mac?
on:
  push:
    branches:
      - vf-yamnet-hwcheck

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install onnxruntime-node (the app's version) on its own
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ort" && cd "$RUNNER_TEMP/ort" && npm init -y >/dev/null && npm install onnxruntime-node@1.29.0
      - name: Download the pinned model and check its SHA-256
        shell: bash
        run: |
          curl -sL -o "$RUNNER_TEMP/yamnet.onnx" https://huggingface.co/audiomagic/yamnet-onnx/resolve/f25b741c2f0bdc6d7e6db24b5fddda23347dbafd/yamnet.onnx
          node -e "const h=require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex');console.log(h);if(h!=='d3835ffbbd4a1bb3e777f0ca217b5007907f5171dd5d17c4236b95b2af8f908e')process.exit(1)" "$RUNNER_TEMP/yamnet.onnx"
      - name: Load and classify
        shell: bash
        env:
          REF: '{"silence":{"speech":0,"music":0,"singing":0},"noise":{"speech":0.012,"music":0.004,"singing":0.0001},"chord":{"speech":0.0003,"music":0.8432,"singing":0.0008},"voicelike":{"speech":0.1129,"music":0.0227,"singing":0.0008},"resample48k":{"music":0.0006}}'
        run: |
          export NODE_PATH="$RUNNER_TEMP/ort/node_modules"
          export VF_SPEECH_MODEL="$RUNNER_TEMP/yamnet.onnx"
          node research/hwcheck/yamnet-check.js
