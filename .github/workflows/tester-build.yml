# Voice-Follow tester installers, built natively per platform. Run by hand from the Actions
# tab (or the API). Needs one repository secret: VF_UPLOAD_KEY (the S3 upload key).
name: Tester build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022: node-gyp 9 (pinned by the lockfile) does not recognise the Visual
          # Studio 2026 on windows-latest, so native modules (mdns) fail to compile there.
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The 184 MB model does not compress; "store" keeps the installers a little larger but
      # takes minutes instead of an hour on a 2-core runner. DEBUG makes a stall readable.
      DEBUG: electron-builder
      BONJOUR_SDK_HOME: 'C:\Program Files\Bonjour SDK'
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools wheel
      - name: Point node-gyp at this Python
        shell: bash
        run: echo "npm_config_python=$pythonLocation/python${{ matrix.platform == 'win' && '.exe' || '3' }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Bonjour SDK (Windows, for the mdns module)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/Bonjour64.msi" -OutFile "Bonjour64.msi"
          Start-Process msiexec.exe -ArgumentList "/i Bonjour64.msi /qn" -Wait
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/bonjoursdksetup.exe" -OutFile "bonjoursdksetup.exe"
          Start-Process bonjoursdksetup.exe -ArgumentList "/quiet" -Wait

      - name: Install dependencies (native modules built for this platform)
        run: npm ci

      - name: Speech model (bundled into the installer)
        shell: bash
        run: |
          mkdir -p build-resources/voice-follow
          curl -L --retry 3 -o build-resources/voice-follow/model.int8.onnx \
            "https://huggingface.co/karansea/indicconformer-stt-pa-ctc-shabad-preview/resolve/main/model.int8.onnx?download=true"
          SIZE=$(wc -c < build-resources/voice-follow/model.int8.onnx | tr -d ' ')
          echo "model bytes: $SIZE"; test "$SIZE" -gt 180000000

      - name: Exclude research data from the installer
        shell: bash
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));if(!p.build.files.includes("!research${/*}"))p.build.files.push("!research${/*}");fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Build
        run: npm run build

      - name: Inject the upload key into the compiled config
        shell: bash
        env:
          VF_UPLOAD_KEY: ${{ secrets.VF_UPLOAD_KEY }}
        run: |
          test -n "$VF_UPLOAD_KEY" || { echo "VF_UPLOAD_KEY secret is not set"; exit 1; }
          f=www/js/addons/voice-follow/shadow/config.js
          node -e 'const fs=require("fs");const f=process.argv[1];const s=fs.readFileSync(f,"utf8");if(!s.includes("__VF_UPLOAD_KEY__"))process.exit(2);fs.writeFileSync(f,s.replace("__VF_UPLOAD_KEY__",process.env.VF_UPLOAD_KEY))' "$f"
          grep -q "__VF_UPLOAD_KEY__" "$f" && exit 1 || echo "key injected"

      - name: Package (Windows)
        if: matrix.platform == 'win'
        timeout-minutes: 40
        # bash, not PowerShell: pwsh splits "-c.compression=store" into separate tokens.
        # npmRebuild=false: npm ci's postinstall already built the native modules for Electron;
        # electron-builder's second rebuild hangs on the runner (downloading sharp's binary).
        shell: bash
        run: npx electron-builder --win --x64 --publish never -c.compression=store -c.npmRebuild=false

      - name: Package (macOS, unsigned, Apple Silicon; zip, since DMG creation is done locally)
        if: matrix.platform == 'mac'
        timeout-minutes: 40
        run: npx electron-builder --mac zip --arm64 --publish never -c.compression=store -c.npmRebuild=false

      - name: Checks on the output
        shell: bash
        run: |
          ls -la builds/ | grep -E "\.exe$|\.dmg$|\.zip$"
          if [ "${{ matrix.platform }}" = win ]; then
            test -f builds/win-unpacked/resources/voice-follow/model.int8.onnx
            file builds/win-unpacked/resources/app.asar.unpacked/node_modules/realm/build/Release/realm.node | grep -q "PE32+"
            node -e 'const p=require("./builds/win-unpacked/resources/app.asar.unpacked/node_modules/anvaad-js/package.json");if(p.version<"1.5.1")process.exit(1);console.log("anvaad-js",p.version)'
          else
            ls builds/mac-arm64/*.app/Contents/Resources/voice-follow/model.int8.onnx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tester-${{ matrix.platform }}
          path: |
            builds/*.exe
            builds/*.dmg
            builds/*.zip
          if-no-files-found: error
          retention-days: 30
