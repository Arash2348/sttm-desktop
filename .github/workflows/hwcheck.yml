name: hwcheck
on:
  push:
    branches: [hwcheck-ci]
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        threads: ['2', '4']
    runs-on: ${{ matrix.os }}
    env:
      VF_ORT_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install onnxruntime-node only
        shell: bash
        run: mkdir ort && cd ort && npm init -y >/dev/null && npm install onnxruntime-node@1.29.0 --no-audit --no-fund && cd .. && mv ort/node_modules ./node_modules
      - name: Download the speech model
        shell: bash
        run: curl -sL -o model.int8.onnx "https://huggingface.co/karansea/indicconformer-stt-pa-ctc-shabad-preview/resolve/main/model.int8.onnx?download=true" && ls -la model.int8.onnx
      - name: Check this computer (3 runs)
        shell: bash
        run: for i in 1 2 3; do node research/hwcheck/ci-run.js model.int8.onnx | tee -a hwcheck-${{ matrix.os }}-t${{ matrix.threads }}.txt; done
      - uses: actions/upload-artifact@v4
        with:
          name: hwcheck-${{ matrix.os }}-t${{ matrix.threads }}
          path: hwcheck-${{ matrix.os }}-t${{ matrix.threads }}.txt
